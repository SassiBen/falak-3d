[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falak-3d"
version = "0.3.0"
description = "Génération d'objets 3D à partir de texte sur GPU local (Shap-E), avec presets métier"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sassi Benalouache" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy<2",
    "scipy>=1.11",
    "trimesh>=4.4",
    "fast-simplification>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
falak3d = "falak3d.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/falak3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
